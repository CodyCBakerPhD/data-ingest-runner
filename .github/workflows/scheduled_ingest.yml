name: Scheduled Ingest

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *"

# Literal group name, shared with Manual Ingest: github.workflow differs
# between the two entry points, so a constant is what keeps a manual run
# and a scheduled run from ingesting at the same time.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  Ingest:
    uses: ./.github/workflows/ingest.yml
    # No inputs: a scheduled run is always a full, non-dry run against
    # TASK_FORCE_REF (or main). Overrides live on Manual Ingest.
    secrets:
      EMBER_DANDI_API_KEY: ${{ secrets.EMBER_DANDI_API_KEY }}

  # Lives in this wrapper, not ingest.yml: only the unattended scheduled
  # run emails on failure — whoever fires a manual run is already watching.
  # GitHub-hosted runner on purpose, so the mail still goes out when the
  # failure is the self-hosted runner itself.
  NotifyOnFailure:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [Ingest]
    if: ${{ always() && needs.Ingest.result == 'failure' }}
    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: Data Ingest Runner Scheduled Ingest"
          to: cody.c.baker.phd@gmail.com
          from: Data Ingest Runner <data-ingest-runner@users.noreply.github.com>
          body: "The scheduled ingest workflow failed, please check status at https://github.com/CodyCBakerPhD/data-ingest-runner/actions/workflows/scheduled_ingest.yml"
