name: Scheduled Ingest

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *"

# Literal group name, shared with Manual Ingest: github.workflow differs
# between the two entry points, so a constant is what keeps a manual run
# and a scheduled run from ingesting at the same time.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  Ingest:
    uses: ./.github/workflows/ingest.yml
    # No inputs: a scheduled run is always a full, non-dry run against
    # TASK_FORCE_REF (or main). Overrides live on Manual Ingest.
    secrets:
      EMBER_DANDI_API_KEY: ${{ secrets.EMBER_DANDI_API_KEY }}

  # Lives in this wrapper, not ingest.yml: only the unattended scheduled
  # run emails on failure — whoever fires a manual run is already watching.
  # GitHub-hosted runner on purpose, so the mail still goes out when the
  # failure is the self-hosted runner itself.
  NotifyOnFailure:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [Ingest]
    # 'cancelled' as well as 'failure': an offline runner never fails the
    # job -- it just sits queued until GitHub cancels it 24h later -- so a
    # cancelled Ingest is the one signal that the runner is down. Repeats
    # daily (each day's run queues and times out in turn) until it's back.
    if: ${{ always() && (needs.Ingest.result == 'failure' || needs.Ingest.result == 'cancelled') }}
    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          # Cancelled means the runner never picked the job up: say so, since
          # it's the runner to go fix then, not the ingest.
          subject: >-
            ${{ needs.Ingest.result == 'cancelled'
            && 'Runner Offline: Data Ingest Runner Scheduled Ingest'
            || 'CI Failure: Data Ingest Runner Scheduled Ingest' }}
          to: cody.c.baker.phd@gmail.com
          from: Data Ingest Runner <data-ingest-runner@users.noreply.github.com>
          body: >-
            ${{ needs.Ingest.result == 'cancelled'
            && 'The scheduled ingest was cancelled without ever starting: GitHub cancels a job once it has waited 24 hours for a runner, so the self-hosted runner is most likely offline. Check it at https://github.com/CodyCBakerPhD/data-ingest-runner/settings/actions/runners and the run at https://github.com/CodyCBakerPhD/data-ingest-runner/actions/workflows/scheduled_ingest.yml'
            || 'The scheduled ingest workflow failed, please check status at https://github.com/CodyCBakerPhD/data-ingest-runner/actions/workflows/scheduled_ingest.yml' }}
